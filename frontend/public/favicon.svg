<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 512 512 fill=none>
  <defs>
    <linearGradient id=bg-grad x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#0f172a/>
      <stop offset=100% stop-color=#020617/>
    </linearGradient>
    <linearGradient id=emerald-glow x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#34d399/>
      <stop offset=50% stop-color=#00a86b/>
      <stop offset=100% stop-color=#059669/>
    </linearGradient>
    <filter id=glow x=-20% y=-20% width=140% height=140%>
      <feGaussianBlur stdDeviation=8 result=blur/>
      <feComposite in=SourceGraphic in2=blur operator=over/>
    </filter>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect width=512 height=512 rx=128 fill=url(#bg-grad)/>
  <rect width=510 height=510 x=1 y=1 rx=127 stroke=#1e293b stroke-width=2/>
  
  <!-- Ambient glow backdrop -->
  <circle cx=256 cy=256 r=140 fill=#00a86b opacity=0.12 filter=url(#glow)/>
  
  <!-- Linear-Style Prestige Monogram Structure -->
  <g stroke-linecap=round stroke-linejoin=round>
    <!-- Outer Arc -->
    <path d=M 256 120 A 136 136 0 1 1 144 330 L 144 392 
          stroke=url(#emerald-glow) 
          stroke-width=24 
          fill=none />
          
    <!-- Inner Mathematical Precision Loop 'P' -->
    <path d=M 216 392 L 216 190 C 216 150 330 150 330 232 C 330 300 216 300 216 300 
          stroke=url(#emerald-glow) 
          stroke-width=24 
          fill=none />

    <!-- Center AI Node Sparkle -->
    <circle cx=270 cy=232 r=14 fill=#34d399 filter=url(#glow)/>
  </g>
</svg>
