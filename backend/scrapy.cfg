# Scrapy project configuration for the Prestige live web & documentation crawler.
#
# This file is required: Scrapy's config discovery appends the result of
# closest_scrapy_cfg() to its config sources, and when no scrapy.cfg exists that
# result is an empty string. ConfigParser.read("") calls open(""), which hard-
# crashes CPython 3.14 on Windows. Having this file here gives discovery a real
# path and keeps the fallback spider (scraper/spiders/content_spider.py) runnable
# via:  python -m scrapy runspider scraper/spiders/content_spider.py
[settings]
default = scraper.settings

[deploy]
# url = http://localhost:6800/
project = prestige_scraper
